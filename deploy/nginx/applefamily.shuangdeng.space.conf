server {
    listen 80;
    listen [::]:80;
    server_name applefamily.shuangdeng.space;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name applefamily.shuangdeng.space;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/applefamily.shuangdeng.space/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/applefamily.shuangdeng.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
